<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hangman Duel</title><style>body{font-family:system-ui;background:#101827;color:white;display:grid;place-items:center;min-height:100vh;margin:0}main{width:min(520px,92vw);background:#1c2940;border-radius:20px;padding:25px;box-sizing:border-box;text-align:center}h1{margin:0 0 8px}p{color:#bdc9dd}input,button{font:inherit;border:0;border-radius:9px;padding:12px}input{width:90%;margin:10px 0;background:#f4f6fa}button{cursor:pointer;background:#55e6ad;color:#102016;font-weight:700;margin:5px}button:disabled{opacity:.35;cursor:default}.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}.keys button{width:43px;padding:10px 0}.word{font-size:clamp(20px,5vw,32px);letter-spacing:5px;overflow-wrap:anywhere;margin:20px 0}svg{width:180px;height:210px}.hidden{display:none}#status{font-weight:700;color:#55e6ad}small{color:#a8b6cd}</style></head><body><main><h1>💀 HANGMAN DUEL</h1><p>Challenge your mate. Loser buys coffee ☕</p><section id="setup"><h2>Set a secret word</h2><input id="secret" maxlength="70" placeholder="Word or phrase (letters only)" autocomplete="off"><br><button id="create">Create challenge</button><p id="linkbox" class="hidden"><input id="challenge" readonly><br><button id="copy">Copy challenge link</button><br><small>Send this link on Teams. The word is encoded, not encrypted—no sensitive secrets!</small></p></section><section id="play" class="hidden"><svg viewBox="0 0 180 210"><g stroke="#dbe6f5" stroke-width="5" stroke-linecap="round" fill="none"><path d="M15 200H125M45 200V15H105V40"/><g id="parts"><path d="M105 40V43"/><path d="M105 43V46"/><path d="M105 46V49"/><circle cx="105" cy="69" r="20"/><path d="M105 89V112"/><path d="M105 112V137"/><path d="M105 99L86 110"/><path d="M86 110L70 120"/><path d="M105 99L124 110"/><path d="M124 110L140 120"/><path d="M105 137L75 175"/><path d="M105 137L135 175"/></g></g></svg><div id="word" class="word"></div><p id="status"></p><div id="keys" class="keys"></div><button id="again" class="hidden">Set a word to send back ↩</button></section></main><script>
const $=id=>document.getElementById(id);let answer='',guesses=new Set(),wrong=0;const max=12;
function encode(s){return btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decode(s){let bin=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function setup(){history.replaceState(null,'',location.pathname);$('setup').classList.remove('hidden');$('play').classList.add('hidden');$('linkbox').classList.add('hidden');$('secret').value=''}
function play(s){answer=s.toUpperCase();guesses=new Set();wrong=0;$('setup').classList.add('hidden');$('play').classList.remove('hidden');$('again').classList.add('hidden');$('keys').innerHTML='';for(const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){let b=document.createElement('button');b.textContent=c;b.onclick=()=>guess(c);$('keys').append(b)}render()}
function guess(c){if(guesses.has(c)||wrong>=max)return;guesses.add(c);if(!answer.includes(c))wrong++;render()}
function render(){let won=[...answer].every(c=>!/[A-Z]/.test(c)||guesses.has(c)),lost=wrong>=max;$('word').textContent=[...answer].map(c=>/[A-Z]/.test(c)?(guesses.has(c)||lost?c:'_'):c).join(' ');$('parts').querySelectorAll('circle,path').forEach((el,i)=>el.style.visibility=i<wrong?'visible':'hidden');$('status').textContent=won?'🎉 YOU WIN!':lost?'💀 GAME OVER! Word: '+answer:`Wrong guesses: ${wrong} / ${max}`;[...$('keys').children].forEach(b=>b.disabled=won||lost||guesses.has(b.textContent));$('again').classList.toggle('hidden',!(won||lost))}
$('create').onclick=()=>{let s=$('secret').value.trim().replace(/\s+/g,' ');if(!s||!/^[a-zA-Z ]+$/.test(s)){alert('Enter letters and spaces only');return}let url=new URL(location.href);url.hash='word='+encode(s);$('challenge').value=url.href;$('linkbox').classList.remove('hidden')};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('challenge').value);$('copy').textContent='Copied!'}catch{ $('challenge').select();alert('Copy the selected link with Ctrl+C')}};$('again').onclick=setup;try{let h=new URLSearchParams(location.hash.slice(1)).get('word');if(h){let s=decode(h);if(/^[a-zA-Z ]{1,70}$/.test(s))play(s)}}catch{};
</script></body></html>
